name: "Daily update (AU chart + US store links)"

on:
  schedule:
    # 13:17 UTC = 6:17 AM Pacific in summer (5:17 AM in winter).
    # Kept well away from the Mac's 9:15 AM US run so they never save at once.
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: record-au
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Read today's chart
        run: node scripts/scrape.mjs

      - name: Find store links and pictures for US games
        continue-on-error: true
        run: node scripts/find-us-links.mjs

      - name: Save to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/au
          for f in data/us/links.json data/us/web-art.json data/us/web-art; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No change to save."
          else
            git commit -m "Daily update for $(TZ=America/Los_Angeles date +%F)"
            git pull --rebase
            git push
          fi

      - name: Keep the page snapshot when something breaks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-snapshot
          path: debug/
          if-no-files-found: ignore
