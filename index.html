<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>STREAK-TENDO - eShop #1 Top Game by Day</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="STREAK-TENDO">
<meta name="theme-color" content="#F8F6F1">
<!-- Visitor stats (GoatCounter). Pageviews are sent from the page script below. -->
<script>
  // Pageviews are sent by the page script. To stop counting your own visits in a browser,
  // open the site with #toggle-goatcounter on the end; GoatCounter's script handles that.
  window.goatcounter = {no_onload: true};
</script>
<script data-goatcounter="https://streaktendo.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#F8F6F1;--surface:#FFFFFF;--ink:#1F1D1A;--muted:#6E6A62;--line:#E7E2D8;--accent:#2B48D6;--accent-ink:#FFFFFF;--bar-l:52%;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
#root{max-width:960px;margin:0 auto;padding:18px 16px 48px}
.top-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-height:36px;padding-right:220px}
.region-block{text-align:center}
.region-seg button{padding:8px 18px;font-size:1rem}
.flag{font-size:1.15em;line-height:1;vertical-align:-1px}
.soon{color:var(--muted);margin:14px 0 0;font-size:.95rem}
.soon-flags{display:inline-flex;gap:6px;margin-left:6px;font-size:1.25rem;vertical-align:-3px}
.nav-blog{color:var(--accent);font-weight:600;font-size:.95rem;text-decoration:none;white-space:nowrap}
.nav-blog:hover{text-decoration:underline;text-underline-offset:3px}
/* Switch 1 / Switch 2 buttons follow you down the page */
.switch-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:-36px;pointer-events:none}
.switch-wrap .seg{pointer-events:auto;box-shadow:0 4px 16px rgba(31,29,26,.14)}
@media (max-width:820px){.top-bar{padding-right:0;justify-content:center;text-align:center}.switch-wrap{justify-content:center;margin-top:12px}}
h1{font-size:1rem;font-weight:600;margin:0;color:var(--muted)}
h2{font-size:1.35rem;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 14px;font-size:.95rem}
section{margin-top:44px}

/* Hero: the day's top game */
.hero{margin-top:26px;text-align:center;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.hero-label{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.hero-art{display:block;width:min(100%,540px);margin:0 auto;border-radius:22px;box-shadow:0 18px 50px rgba(31,29,26,.18),0 2px 6px rgba(31,29,26,.08);background:var(--surface);overflow:hidden}
.hero-art img{display:block;width:100%;height:auto}
/* Red "Switch 2" band for Switch 2 pictures that don't already have one */
.s2wrap{display:flex;flex-direction:column;width:100%;height:100%;container-type:inline-size}
.s2band{order:-1;flex:none;height:max(3px,6.5cqw);background:#E60012;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:4cqw;line-height:1;letter-spacing:.03em;text-decoration:none;pointer-events:none}
.s2wrap>img,.s2wrap>.ph{flex:1 1 auto;min-height:0;width:100%;object-fit:cover}
@container (max-width:90px){.s2band span{display:none}}
a.hero-art{text-decoration:none;transition:transform .2s ease,box-shadow .2s ease}
a.hero-art:hover{transform:translateY(-3px);box-shadow:0 24px 60px rgba(31,29,26,.22),0 2px 6px rgba(31,29,26,.08)}
a.thumb{display:block}
.name-link{color:inherit;text-decoration:none}
.name-link:hover{text-decoration:underline;text-underline-offset:3px}
.hero-game{font-size:clamp(1.8rem,6vw,3rem);font-weight:800;line-height:1.05;letter-spacing:-.025em;margin:22px auto 8px;max-width:640px;overflow-wrap:anywhere}
.hero-meta{color:var(--muted);font-size:1rem;margin:0}
.pips{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:14px auto 0;max-width:540px}
.pip{width:14px;height:14px;border-radius:4px}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}

/* Placeholder when a game has no image yet */
.ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#fff;font-weight:800;text-align:center;padding:8%;line-height:1.1}
.hero-art .ph{aspect-ratio:1;font-size:clamp(1.6rem,6vw,2.6rem)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.9rem;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.spaced{margin-bottom:12px}

/* Calendar: one picture per day */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;scrollbar-width:none}
.cal-scroll::-webkit-scrollbar{display:none}
.cal-scroll.dragging{scroll-snap-type:none}
.cal-track{display:flex}
.cal-page{flex:0 0 100%;scroll-snap-align:start;box-sizing:border-box;padding:0 1px}
.cal-title{text-align:center;font-weight:800;font-size:1.1rem;margin:2px 0 10px}
.cal-panel .sk-scrub{margin-right:0}
.cal-head strong{font-size:1.1rem}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:40px;height:40px;font:inherit;font-size:1.1rem;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{font-size:.75rem;color:var(--muted);text-align:center;padding-bottom:2px}
.day{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0;font:inherit;color:var(--muted);cursor:pointer;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.day img{width:100%;height:100%;object-fit:cover;display:block}
.day .ph{font-size:.55rem;padding:3px}
.day.blank{visibility:hidden}
.cal-month{grid-column:1/-1;font-weight:800;font-size:1.05rem;padding:14px 2px 4px}
.cal-month.first{padding-top:2px}
.day.future{opacity:.45}
.day.nodata{font-size:.75rem;cursor:default}
.day.today{outline:2.5px solid var(--accent);outline-offset:1px}
.day.sel{outline:2.5px solid var(--ink);outline-offset:1px}

.list{margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.thumb{width:48px;height:48px;border-radius:8px;overflow:hidden;flex:none;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font-size:.5rem}
.rank{width:1.6em;color:var(--muted);font-weight:600;text-align:right;flex:none}
.grow{flex:1;min-width:0}
.dates{color:var(--muted);font-size:.85rem}
.len{font-weight:800;font-size:1.25rem;white-space:nowrap}
.len small{font-size:.8rem;font-weight:400;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.empty{color:var(--muted);padding:18px 4px}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;line-height:1.7}
footer a{color:var(--accent);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* Streak chart: 14 day columns, one row per game */
.icon-btn:disabled{opacity:.35;cursor:default}
@media (max-width:520px){.grid{gap:3px}.day{border-radius:6px}}
/* Streaks: sideways-scrolling day timeline */
.sk-panel{padding:14px 0 14px 14px;--col:18px}
.sk-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sk-scroll::-webkit-scrollbar{display:none}
.sk-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:5;overflow:hidden;background:var(--surface);padding-top:6px}
.sk-inner{position:relative;padding-right:14px;box-sizing:content-box}
.sk-months{display:flex;height:20px}
.sk-month{flex:none;font-size:.8rem;font-weight:600;white-space:nowrap;border-left:1px solid var(--line);box-sizing:border-box}
.sk-month:first-child{border-left:0}
.sk-mlabel{position:sticky;left:0;display:inline-block;padding:0 4px;background:var(--surface)}
.sk-scrub{position:relative;height:28px;margin-right:14px;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.sk-scrub::before{content:"";position:absolute;left:0;right:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--line)}
.sk-thumb{position:absolute;left:0;top:50%;height:12px;margin-top:-6px;border-radius:6px;background:var(--accent);box-shadow:0 1px 3px rgba(31,29,26,.25)}
.sk-scrub.drag .sk-thumb,.sk-scrub:hover .sk-thumb{height:14px;margin-top:-7px}
.sk-scrub-top{margin-bottom:6px}
.sk-scrub-bottom{margin-top:8px}
.sk-days{display:grid;grid-auto-flow:column;grid-auto-columns:var(--col);border-bottom:1px solid var(--line);padding-bottom:5px}
.sk-day{text-align:center;font-size:.66rem;color:var(--muted)}
.sk-day.now{color:var(--accent);font-weight:800}
.sk-row{margin-top:12px}
.sk-label{position:sticky;left:0;display:inline-flex;align-items:center;gap:8px;max-width:min(100%,82vw);font-size:.9rem;font-weight:600;margin-bottom:5px;background:var(--surface);padding-right:8px}
.sk-label .thumb{width:28px;height:28px;border-radius:6px}
.sk-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sk-track{position:relative;height:26px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--bg) 0 calc(var(--col) - 2px),transparent calc(var(--col) - 2px) var(--col))}
.sk-bar{position:absolute;top:0;height:26px;border-radius:7px;color:#fff;font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div id="root"><p class="sub">Loading…</p></div>
<script>
(function(){
var DAY=86400000;
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTHS_L=['January','February','March','April','May','June','July','August','September','October','November','December'];
var CHARTS=[['switch2','Switch 2'],['switch1','Switch 1']];
// To add a region: add a line here and a data/<id>/history.json file.
var REGIONS=[
  {id:'us',label:'US',flag:'🇺🇸',name:'the US',source:'Checked once a day from the US Best Sellers lists in the Nintendo Store app.',
   search:function(q){return 'https://www.nintendo.com/us/search/#q='+encodeURIComponent(q)+'&p=1&cat=gme&sort=df';}},
  {id:'au',label:'Australia',flag:'🇦🇺',name:'Australia',source:'Checked once a day from the Nintendo Australia store\'s digital-download charts.',
   search:function(q){return 'https://store.nintendo.com.au/au/catalogsearch/result/?q='+encodeURIComponent(q);}}
];
var region=pickRegion();
function regionInfo(){return REGIONS.filter(function(r){return r.id===region;})[0]||REGIONS[0];}
function pickRegion(){
  var ids=REGIONS.map(function(r){return r.id;}), q=(new URLSearchParams(location.search).get('region')||'').toLowerCase(), saved=null;
  if(ids.indexOf(q)>=0)return q;
  try{saved=localStorage.getItem('streaktendo-region');}catch(e){}
  return ids.indexOf(saved)>=0?saved:ids[0];
}
var links={}, extraLinks={}, estimated={}, webArt={};
var history=null, chart='switch2', winEnd=null, WIN=21, selDate=null, entries=[], images={};

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toNum(d){var p=d.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/DAY);}
function toStr(n){return new Date(n*DAY).toISOString().slice(0,10);}
function todayStr(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function nice(n){var d=new Date(n*DAY);return MONTHS[d.getUTCMonth()]+' '+d.getUTCDate();}
function hue(name){var h=0,s=name.toLowerCase();for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return (h*137)%360;}
function col(name){return 'hsl('+hue(name)+' 55% var(--bar-l))';}
function stripRank(t,rank){var m=String(t||'').match(/^#?(\d{1,3})[.):]?\s+(.+)$/);return m&&Number(m[1])===rank?m[2]:String(t||'');}
function cleanList(list){var prev=0;return (list||[]).map(function(g){var t=String(g.title||''),r=prev+1,m=t.match(/^#?(\d{1,3})[.):]?\s+(.+)$/);
  if(m&&Number(m[1])>prev&&Number(m[1])<=prev+5){r=Number(m[1]);t=m[2];}prev=r;return {rank:r,title:t,image:g.image,url:g.url};});}
function chartLabel(){return (CHARTS.filter(function(c){return c[0]===chart;})[0]||['',''])[1];}

function art(game,eager){
  // Prefer the picture for this platform (Switch 1 and Switch 2 versions can differ).
  var src=images[chart+'|'+game]||images[game];
  var pic=src?'<img src="'+esc(src)+'" alt="'+esc(game)+'"'+(eager?' fetchpriority="high"':' loading="lazy"')+' decoding="async">'
             :'<div class="ph" style="background:'+col(game)+'" role="img" aria-label="'+esc(game)+'">'+esc(game)+'</div>';
  // Switch 2 games get a red "Switch 2" band across the top, like the US Nintendo Store app shows.
  // Pictures cut from that app (data/us/art/) already include it, so they're left as they are.
  if(chart==='switch2'&&!(src&&src.indexOf('data/us/art/')===0))
    return '<span class="s2wrap">'+pic+'<span class="s2band" aria-hidden="true"><span>Switch 2</span></span></span>';
  return pic;
}

// Sends a pageview or event to GoatCounter once its script has loaded.
function gc(vars){
  try{if(localStorage.getItem('skipgc')==='t')return;}catch(e){}
  var tries=0;
  (function go(){
    if(window.goatcounter&&window.goatcounter.count){try{window.goatcounter.count(vars);}catch(e){}}
    else if(tries++<50)setTimeout(go,200);
  })();
}

// Store link for a game: exact product page when known, otherwise a store search for its name.
function buyUrl(game){
  return links[chart+'|'+game]||links[game]||regionInfo().search(game);
}
function buyLink(game,inner,cls){
  return '<a class="'+(cls||'')+'" href="'+esc(buyUrl(game))+'" target="_blank" rel="noopener" data-gc="'+esc('store/'+region+'/'+chart+'/'+game)+'" title="'+esc(game)+' in the Nintendo eShop">'+inner+'</a>';
}

function indexImages(){
  images={};links={};var days=history.days||{};
  Object.keys(extraLinks||{}).forEach(function(k){links[k]=extraLinks[k];});
  // Pictures saved from store pages, used only for games with no picture from the charts.
  Object.keys(webArt||{}).forEach(function(k){if(!images[k])images[k]=webArt[k];var t=k.slice(k.indexOf('|')+1);if(k.indexOf('|')>=0&&!images[t])images[t]=webArt[k];});
  var pri=function(src){return /\/art\//.test(src)?2:1;};
  var better=function(t,src){if(!src||/^https?:/.test(src))return;if(!images[t]||pri(src)>pri(images[t]))images[t]=src;};
  Object.keys(history.images||{}).forEach(function(t){better(cleanList([{title:t}])[0].title,history.images[t]);better(t,history.images[t]);});
  Object.keys(days).sort().forEach(function(d){var ch=days[d].charts||{};Object.keys(ch).forEach(function(k){cleanList(ch[k]).forEach(function(g){better(g.title,g.image);
    if(g.image&&!/^https?:/.test(g.image))images[k+'|'+g.title]=g.image;   // newest day wins for each platform
    if(/^https?:\/\//.test(g.url||'')){links[k+'|'+g.title]=g.url;links[g.title]=g.url;}});});});
}
// Real daily records always win; estimated days (from weekly charts) only fill dates with no record.
function estFor(d){var e=(estimated.days||{})[d];return e&&e.no1&&e.no1[chart]?e:null;}
function build(){
  var days=history.days||{}, all={};
  Object.keys(days).forEach(function(d){if(days[d].no1&&days[d].no1[chart])all[d]={date:d,game:stripRank(days[d].no1[chart],1),est:false};});
  Object.keys(estimated.days||{}).forEach(function(d){var e=estFor(d);if(e&&!all[d])all[d]={date:d,game:e.no1[chart],est:true};});
  entries=Object.keys(all).sort().map(function(d){return all[d];});
}
function byDate(){var m={};entries.forEach(function(e){m[e.date]=e;});return m;}
function streaks(){
  var out=[],cur=null;
  entries.forEach(function(e){var n=toNum(e.date);
    if(cur&&cur.game===e.game&&n===cur.end+1)cur.end=n;else{cur={game:e.game,start:n,end:n,estDays:[]};out.push(cur);}
    if(e.est)cur.estDays.push(n);});
  out.forEach(function(s){s.len=s.end-s.start+1;s.est=s.estDays.length>0;});
  return out;
}

function topBar(){
  var days=history.days||{}, avail=CHARTS.filter(function(c){return Object.keys(days).some(function(d){return days[d].no1&&days[d].no1[c[0]];});});
  var seg=avail.length>1?'<div class="seg" role="group" aria-label="Which chart">'+avail.map(function(c){return '<button type="button" data-chart="'+c[0]+'" aria-pressed="'+(chart===c[0])+'">'+c[1]+'</button>';}).join('')+'</div>':'';
  return '<div class="top-bar"><h1>STREAK-TENDO - eShop #1 Top Game by Day</h1></div>'+(seg?'<div class="switch-wrap">'+seg+'</div>':'');
}

// Region picker at the bottom of the page, with a teaser for future regions.
var SOON=[['🇯🇵','Japan'],['🇬🇧','United Kingdom'],['🇪🇺','Europe'],['🇨🇦','Canada'],['🇰🇷','South Korea'],['🇭🇰','Hong Kong']];
function regionBlock(){
  var reg='<div class="seg region-seg" role="group" aria-label="Which region">'+REGIONS.map(function(r){
    return '<button type="button" data-region="'+r.id+'" aria-pressed="'+(region===r.id)+'"><span class="flag" aria-hidden="true">'+r.flag+'</span> '+r.label+'</button>';}).join('')+'</div>';
  var soon='<p class="soon">More regions coming soon! <span class="soon-flags">'+SOON.map(function(f){return '<span title="'+f[1]+'" aria-label="'+f[1]+'">'+f[0]+'</span>';}).join('')+'</span></p>';
  return '<section class="region-block"><h2>Region</h2>'+reg+soon+'</section>'+
    '<section class="region-block"><h2>Blog &amp; Revisions</h2><p class="soon">Coming Soon</p></section>'+
    '<section class="region-block"><h2>Feedback</h2><p class="soon">Coming Soon</p></section>';
}


function hero(st){
  if(!entries.length)return '<div class="hero"><div class="hero-game">Waiting for the first daily check</div><p class="hero-meta">The first entry appears after the scheduled job runs.</p></div>';
  var t=toNum(todayStr()), last=st[st.length-1], isToday=last.end===t;
  var label=isToday?'Today\'s top '+chartLabel()+' game in '+regionInfo().name
    :'Top '+chartLabel()+' game in '+regionInfo().name+' as of '+nice(last.end)+', '+new Date(last.end*DAY).getUTCFullYear();
  var pips='';for(var i=0;i<Math.min(last.len,60);i++)pips+='<span class="pip" style="background:'+col(last.game)+'"></span>';
  return '<div class="hero"><p class="hero-label">'+esc(label)+'</p>'+buyLink(last.game,art(last.game,true),'hero-art')+
    '<div class="hero-game">'+esc(last.game)+'</div>'+
    '<p class="hero-meta">'+(last.len===1?'First day on top':last.len+' days in a row, since '+nice(last.start))+'</p>'+(last.len>1?'<div class="pips" aria-hidden="true">'+pips+'</div>':'')+'</div>';
}

// Calendar: every month side by side, oldest on the left. It opens on the current month
// and scrolls sideways (one month per swipe) to go back in time, with the same scrollbars
// as the Streaks timeline.
function monthGrid(idx,map,t,tn){
  var y=Math.floor(idx/12), m=idx%12;
  var start=Math.round(Date.UTC(y,m,1)/DAY), end=Math.round(Date.UTC(y,m+1,1)/DAY)-1;
  var h='<div class="cal-page"><div class="cal-title">'+MONTHS_L[m]+' '+y+'</div><div class="grid">';
  ['S','M','T','W','T','F','S'].forEach(function(d){h+='<div class="dow">'+d+'</div>';});
  for(var i=0;i<new Date(start*DAY).getUTCDay();i++)h+='<div class="day blank"></div>';
  for(var n=start;n<=end;n++){
    var ds=toStr(n), en=map[ds], g=en&&en.game, future=n>tn;
    var cls='day'+(g?'':' nodata')+(future?' future':'')+(ds===t?' today':'')+(ds===selDate?' sel':'');
    var tip=g?nice(n)+': '+g:'';
    h+=g?'<button type="button" class="'+cls+'" data-day="'+ds+'" aria-label="'+esc(tip)+'" title="'+esc(tip)+'">'+art(g)+'</button>'
        :'<div class="'+cls+'" aria-hidden="true">'+new Date(n*DAY).getUTCDate()+'</div>';
  }
  return h+'</div></div>';
}
function calendar(){
  var map=byDate(), t=todayStr(), tn=toNum(t);
  var latest=Math.max(tn, entries.length?toNum(entries[entries.length-1].date):tn), ld=new Date(latest*DAY);
  var first=entries.length?new Date(toNum(entries[0].date)*DAY):ld;
  var lastIdx=ld.getUTCFullYear()*12+ld.getUTCMonth(), firstIdx=first.getUTCFullYear()*12+first.getUTCMonth();
  var pages='';for(var idx=firstIdx;idx<=lastIdx;idx++)pages+=monthGrid(idx,map,t,tn);
  return '<section><h2>Calendar</h2><p class="sub">Tap a day to see its top 10. Scroll sideways to go back in time.</p><div class="panel cal-panel">'+
    scrubber('top','calscroll')+'<div class="cal-scroll" id="calscroll"><div class="cal-track">'+pages+'</div></div>'+scrubber('bottom','calscroll')+
    '</div>'+detail()+'</section>';
}

function detail(){
  if(!selDate)return '';
  var rec=(history.days||{})[selDate], list=rec&&rec.charts&&cleanList(rec.charts[chart]);
  var est=!(rec&&rec.no1&&rec.no1[chart])&&estFor(selDate);
  if(est){
    var g=est.no1[chart];
    return '<div class="panel" style="margin-top:12px" id="detail"><strong>'+esc(chartLabel())+' #1, '+nice(toNum(selDate))+'</strong>'+
      '<ul class="list"><li><span class="rank">1</span>'+buyLink(g,art(g),'thumb')+buyLink(g,esc(g),'grow name-link')+'</li></ul></div>';
  }
  var body=list&&list.length
    ?'<ul class="list">'+list.map(function(g){var t=g.title;return '<li><span class="rank">'+g.rank+'</span>'+buyLink(t,art(t),'thumb')+buyLink(t,esc(t),'grow name-link')+'</li>';}).join('')+'</ul>'
    :'<p class="empty">No chart was recorded this day.</p>';
  return '<div class="panel" style="margin-top:12px" id="detail"><strong>'+esc(chartLabel())+' top 10, '+nice(toNum(selDate))+'</strong>'+body+'</div>';
}

// Streaks: one row per game for the last 8 games to hold #1 (current game on top),
// laid out on a day-by-day timeline that scrolls sideways. It opens on today and ends
// on the left where the oldest of those 8 streaks began.
var SK_GAMES=8, SK_COL=18;
// Two identical scrollbars (above and below the Streaks timeline). Both are drawn by the
// page itself so they look the same in every browser, and both follow the timeline: drag
// either thumb, or tap anywhere on a track, and the timeline and the other bar move too.
function scrubber(pos,target){
  target=target||'skscroll';
  return '<div class="sk-scrub sk-scrub-'+pos+'" data-target="'+target+'" role="scrollbar" aria-controls="'+target+'" aria-orientation="horizontal" aria-label="Scroll sideways to go back in time">'+
    '<div class="sk-thumb"></div></div>';
}
// Wires the scrollbars for one sideways-scrolling area (and an optional header that follows it).
function linkBars(scrollId,headId){
  var sk=document.getElementById(scrollId), head=headId&&document.getElementById(headId);
  if(!sk)return function(){};
  var bars=[].slice.call(document.querySelectorAll('.sk-scrub[data-target="'+scrollId+'"]'));
  var room=function(){return Math.max(0,sk.scrollWidth-sk.clientWidth);};
  var layout=function(){
    var r=room();
    bars.forEach(function(b){
      b.hidden=r<=2;
      var tw=b.clientWidth, th=Math.max(44,Math.round(tw*sk.clientWidth/Math.max(sk.scrollWidth,1)));
      var x=r>0?Math.round((tw-th)*sk.scrollLeft/r):0;
      var t=b.firstChild;t.style.width=th+'px';t.style.transform='translateX('+x+'px)';
      b.setAttribute('aria-valuenow',r>0?Math.round(sk.scrollLeft/r*100):100);
    });
    if(head)head.scrollLeft=sk.scrollLeft;
  };
  bars.forEach(function(b){
    var dragging=false, grab=0;
    var moveTo=function(clientX){
      var rect=b.getBoundingClientRect(), th=b.firstChild.offsetWidth, span=rect.width-th;
      var x=Math.min(Math.max(clientX-rect.left-grab,0),span);
      sk.scrollLeft=span>0?x/span*room():0;
    };
    b.addEventListener('pointerdown',function(e){
      var tr=b.firstChild.getBoundingClientRect();
      grab=(e.clientX>=tr.left&&e.clientX<=tr.right)?e.clientX-tr.left:tr.width/2;
      dragging=true;b.classList.add('drag');sk.classList.add('dragging');
      try{b.setPointerCapture(e.pointerId);}catch(err){}
      moveTo(e.clientX);e.preventDefault();
    });
    b.addEventListener('pointermove',function(e){if(dragging)moveTo(e.clientX);});
    var stop=function(){dragging=false;b.classList.remove('drag');sk.classList.remove('dragging');};
    b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);
  });
  sk.addEventListener('scroll',layout,{passive:true});
  layout();
  return layout;
}
// When there are only a few days to show (e.g. a new region), widen the day columns so the
// timeline fills the panel instead of sitting in a corner. Never narrower than SK_COL.
function fitStreakColumns(){
  var panel=document.querySelector('.sk-panel'), sk=document.getElementById('skscroll');
  if(!panel||!sk)return;
  var days=Number(panel.getAttribute('data-days'))||1, avail=sk.clientWidth-14;
  panel.style.setProperty('--col',Math.max(SK_COL,Math.floor(avail/days*100)/100)+'px');
}
function linkScrubber(){
  var a=linkBars('skscroll','skhead'), b=linkBars('calscroll');
  window.onresize=function(){fitStreakColumns();a();b();};
}

function streakChart(st){
  if(!st.length)return '';
  var t=toNum(todayStr()), latest=Math.max(st[st.length-1].end,t), games=[];
  for(var i=st.length-1;i>=0&&games.length<SK_GAMES;i--)if(games.indexOf(st[i].game)<0)games.push(st[i].game);
  var included=st.filter(function(s){return games.indexOf(s.game)>=0;});
  var start=latest;games.forEach(function(g){   // earliest start among each game's most recent run
    for(var i=st.length-1;i>=0;i--)if(st[i].game===g){start=Math.min(start,st[i].start);break;}});
  var vis=included.filter(function(s){return s.end>=start;}), days=latest-start+1;
  var current=st[st.length-1];
  var months='', runStart=start;
  for(var n=start;n<=latest+1;n++){
    if(n>latest||(n>start&&new Date(n*DAY).getUTCDate()===1)){
      var span=n-runStart;
      var md=new Date(runStart*DAY), mname=span>=6?MONTHS_L[md.getUTCMonth()]:MONTHS[md.getUTCMonth()];
      if(span>=8&&md.getUTCFullYear()!==new Date(t*DAY).getUTCFullYear())mname+=' '+md.getUTCFullYear();
      months+='<div class="sk-month" style="width:calc(var(--col) * '+span+')"><span class="sk-mlabel">'+mname+'</span></div>';
      runStart=n;
    }
  }
  var nums='';for(var m=start;m<=latest;m++)nums+='<div class="sk-day'+(m===t?' now':'')+'">'+new Date(m*DAY).getUTCDate()+'</div>';
  var rows=games.map(function(g){
    var bars=vis.filter(function(s){return s.game===g;}).map(function(s){
      return '<div class="sk-bar" style="left:calc(var(--col) * '+(s.start-start)+' + 1px);width:calc(var(--col) * '+s.len+' - 2px);background:hsl('+hue(g)+' 55% 42%)" title="'+esc(g)+': '+s.len+' day'+(s.len>1?'s':'')+', '+nice(s.start)+(s.len>1?' to '+nice(s.end):'')+'">'+s.len+'d</div>';}).join('');
    var live=g===current.game&&current.end>=t-1;
    return '<div class="sk-row"><div class="sk-label">'+buyLink(g,art(g),'thumb')+'<span class="sk-name">'+buyLink(g,esc(g),'name-link')+(live?'<span class="tag">On top now</span>':'')+'</span></div>'+
      '<div class="sk-track">'+bars+'</div></div>';
  }).join('');
  return '<section><h2>Streaks</h2><p class="sub">The last '+games.length+' games to hold #1. Each bar is a run at the top; the number is how many days it lasted. Scroll sideways to go back in time.</p>'+
    '<div class="panel sk-panel" data-days="'+days+'">'+scrubber('top')+
    // The month/day header sits apart from the rows so it can stay in view while you scroll down the page.
    '<div class="sk-head" id="skhead"><div class="sk-inner" style="width:calc(var(--col) * '+days+')"><div class="sk-months">'+months+'</div><div class="sk-days">'+nums+'</div></div></div>'+
    '<div class="sk-scroll" id="skscroll"><div class="sk-inner" style="width:calc(var(--col) * '+days+')">'+rows+'</div></div>'+
    scrubber('bottom')+'</div></section>';
}

function render(){
  build();
  var st=streaks();
  var updated=history.updatedAt?new Date(history.updatedAt).toLocaleString([], {timeZone:'America/Los_Angeles',dateStyle:'medium',timeStyle:'short'})+' Pacific':'not yet';
  var keep={};['skscroll','calscroll'].forEach(function(id){var o=document.getElementById(id);keep[id]={end:!o||o.scrollLeft+o.clientWidth>=o.scrollWidth-4,left:o?o.scrollLeft:0};});
  document.getElementById('root').innerHTML=topBar()+hero(st)+calendar()+streakChart(st)+regionBlock()+
    '';
  fitStreakColumns();
  ['skscroll','calscroll'].forEach(function(id){var o=document.getElementById(id);if(o)o.scrollLeft=keep[id].end?o.scrollWidth:keep[id].left;});
  linkScrubber();
}

document.getElementById('root').addEventListener('click',function(e){
  var el=e.target.closest('[data-day],[data-chart],[data-region]');if(!el)return;
  if(el.dataset.region){if(el.dataset.region!==region){region=el.dataset.region;['skscroll','calscroll'].forEach(function(id){var k=document.getElementById(id);if(k)k.scrollLeft=k.scrollWidth;});load();window.scrollTo({top:0,behavior:'smooth'});}}
  else if(el.dataset.chart){chart=el.dataset.chart;['skscroll','calscroll'].forEach(function(id){var k=document.getElementById(id);if(k)k.scrollLeft=k.scrollWidth;});render();}
  else if(el.dataset.day){selDate=selDate===el.dataset.day?null:el.dataset.day;render();var dt=document.getElementById('detail');if(dt)dt.scrollIntoView({behavior:'smooth',block:'nearest'});}
});

function load(){
  try{localStorage.setItem('streaktendo-region',region);}catch(e){}
  try{var u=new URL(location.href);u.searchParams.set('region',region);window.history.replaceState(null,'',u);}catch(e){}
  selDate=null;winEnd=null;
  gc({path:'/?region='+region,title:'STREAK-TENDO · '+regionInfo().label});
  extraLinks={};estimated={};webArt={};
  fetch('data/'+region+'/web-art.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():{};}).catch(function(){return {};}).then(function(w){webArt=w||{};
    return fetch('data/'+region+'/estimated.json',{cache:'no-store'});}).then(function(r){return r.ok?r.json():{};}).catch(function(){return {};}).then(function(e){estimated=e||{};
    return fetch('data/'+region+'/links.json',{cache:'no-store'});}).then(function(r){return r.ok?r.json():{};}).catch(function(){return {};}).then(function(l){extraLinks=l||{};
    return fetch('data/'+region+'/history.json',{cache:'no-store'});}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(h){
  history=h;indexImages();
  var avail=CHARTS.filter(function(c){return Object.keys(h.days||{}).some(function(d){return h.days[d].no1&&h.days[d].no1[c[0]];});});if(avail.length)chart=avail[0][0];
  var keys=Object.keys(h.days||{}).sort(), anchor=keys.length?keys[keys.length-1]:todayStr();
  render();
  }).catch(function(err){
    history={days:{}};
    render();
    document.querySelector('.hero').innerHTML='<p class="empty">Couldn\'t load the '+esc(regionInfo().label)+' data ('+esc(err.message)+').</p>';
  });
}
// Count clicks on store links, so you can see which games people go to buy.
document.addEventListener('click',function(e){
  var a=e.target.closest('a[data-gc]');
  if(a)gc({path:a.getAttribute('data-gc'),title:a.getAttribute('title')||'',event:true});
});
load();
})();
</script>
